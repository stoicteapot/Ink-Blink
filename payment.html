<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment - AAD Wear</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <nav class="navbar">
    <div class="brand-title">AAD Wear</div>
    <a href="index.html">Main</a>
    <a href="home.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
  </nav>

  <div class="payment-container" style="max-width:400px;margin:40px auto;padding:24px;border:1px solid #eee;border-radius:10px;">
    <h2 id="productName"></h2>
    <p>Select Payment Method:</p>
    <button onclick="pay('UPI')">Pay with UPI</button>
    <button onclick="pay('PayPal')">Pay with PayPal</button>
    <button onclick="pay('Credit Card')">Pay with Credit Card</button>

    <!-- Stripe Card Payment Form -->
    <div id="paymentForm" style="display:none;">
      <div id="card-element"></div>
      <div id="card-errors" role="alert"></div>
      <button id="submit">Pay Now</button>
    </div>

    <div id="paymentResult" style="margin-top:16px;color:green;"></div>
  </div>

  <script>
    // Get product name from URL
    function getProductName() {
      const params = new URLSearchParams(window.location.search);
      return params.get('product') || 'Product';
    }

    document.getElementById('productName').innerText = 'Buy ' + getProductName();

    // Stripe configuration
    const stripe = Stripe('your-publishable-key-here');  // Replace with your Stripe publishable key
    const elements = stripe.elements();
    const card = elements.create('card');
    card.mount('#card-element');

    function pay(method) {
      if (method === 'UPI') {
        // Open UPI payment link (replace with real link)
        window.location.href = "upi://pay?pa=yourupiid@bank&pn=AADWear&am=500&tn=Payment";
      } else if (method === 'PayPal') {
        // Redirect to PayPal (replace with real link)
        window.location.href = "https://www.paypal.com/paypalme/yourpaypalid/500";
      } else if (method === 'Credit Card') {
        // Show Stripe payment form
        document.getElementById('paymentForm').style.display = 'block';
      } else {
        document.getElementById('paymentResult').innerText = 'Invalid payment method.';
      }
    }

    document.getElementById('submit').addEventListener('click', async (event) => {
      event.preventDefault();

      const {token, error} = await stripe.createToken(card);

      if (error) {
        document.getElementById('card-errors').textContent = error.message;
      } else {
        // Send the token to the server for payment processing
        const response = await fetch('/process-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({token: token.id, amount: 500})  // Amount in cents (500 = $5)
        });

        const result = await response.json();
        if (result.success) {
          document.getElementById('paymentResult').innerText = 'Payment Successful!';
        } else {
          document.getElementById('paymentResult').innerText = 'Payment Failed. Try again.';
        }
      }
    });
    <div id="paymentForm" class="card-tab">
  <h3>💳 Pay with Debit/Credit Card</h3>

  <div class="form-group">
    <label for="card-element">Card Details</label>
    <div id="card-element" class="card-input"></div>
    <div id="card-errors" class="error-msg" role="alert"></div>
  </div>

  <button id="submit">Pay £5.00</button>
</div>

  </script>
</body>
</html>
